# قالب Render للنشر التلقائي عند كل push —
# Render ⭢ New ⭢ Blueprint ⭢ اختر المستودع، واترك الباقي لهذا الملف.
services:
  - type: web
    name: nassr-news
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LEAGUE_ENABLED
        value: "1"
      - key: FLASK_CONFIG
        value: prod
      - key: PWA_ENABLED
        value: "1"
      # قاعدة بيانات دائمة (موصى به) — أدخل رابط Postgres في الواجهة بعد الإنشاء:
      # - key: DATABASE_URL
      #   value: postgresql://user:pass@host:5432/db
      # مسؤول أول يُنشأ تلقائياً عند الإقلاع — املأ الثلاثة من واجهة Render (Environment)
      # - key: ADMIN_USERNAME
      #   value: admin
      # - key: ADMIN_PASSWORD
      #   value: put-a-strong-password-here
      # - key: ADMIN_DISPLAY_NAME
      #   value: مدير النظام