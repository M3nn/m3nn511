{# زر "شاهد المزيد" — مطابق لنمط موقع نادي النصر: نص رمادي + سهم لأسفل #}
{% macro see_more(page, endpoint, extra={}, target='#list-grid') %}
  {% if page.has_next %}
    <div class="see-more-wrap">
      <button type="button" class="see-more"
              hx-get="{{ url_for(endpoint, page=page.next_num, partial=1, **extra) }}"
              hx-target="{{ target }}"
              hx-swap="beforeend">
        <span class="see-more-label">شاهد المزيد</span>
        <svg class="see-more-arrow" viewBox="0 0 448 512" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M413.1 222.5l22.2 22.2c9.4 9.4 9.4 24.6 0 33.9L241 473c-9.4 9.4-24.6 9.4-33.9 0L12.7 278.6c-9.4-9.4-9.4-24.6 0-33.9l22.2-22.2c9.5-9.5 25-9.3 34.3.4L184 343.4V56c0-13.3 10.7-24 24-24h32c13.3 0 24 10.7 24 24v287.4l84.8-84.9c9.4-9.7 24.8-9.9 34.3-.4z"/>
        </svg>
      </button>
    </div>
  {% endif %}
{% endmacro %}
