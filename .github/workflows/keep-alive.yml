name: keep-alive

# مهمّتان في مرور واحد:
#  1) يُبقي خدمة Render المجانية صاحية: تُنام بعد ~15 دقيقة خمول، فنرسل طلبًا
#     دوريًا كل 5 دقائق لمنع النوم (أول زيارة بعد النوم بطيئة).
#  2) إن فرغت قاعدة بيانات الموقع (الملفات مؤقتة على الخطة المجانية) يعبّي
#     المحتوى تلقائيًا من tools/content.json — بلا أي تدخّل بشري.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping nassr-news.onrender.com
        run: |
          set -uo pipefail
          url="https://nassr-news.onrender.com/"
          for i in 1 2 3; do
            code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "OK — the free instance is awake."
              exit 0
            fi
            sleep 10
          done
          echo "No HTTP 200 after retries (possibly cold-starting); exiting 0 on purpose."
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Refill content if the site database was wiped
        continue-on-error: true
        env:
          NASSR_ADMIN_USER: ${{ secrets.NASSR_ADMIN_USER }}
          NASSR_ADMIN_PASSWORD: ${{ secrets.NASSR_ADMIN_PASSWORD }}
        run: python3 tools/reseed.py
