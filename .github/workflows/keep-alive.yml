name: keep-alive

# يُبقي خدمة Render المجانية صاحية: الخطة المجانية تُنيم الخدمة بعد ~15 دقيقة
# خمول، فنرسل طلبًا دوريًا كل 5 دقائق لمنع النوم (أول زيارة بعد النوم بطيئة).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping nassr-news.onrender.com
        run: |
          set -uo pipefail
          url="https://nassr-news.onrender.com/"
          for i in 1 2 3; do
            code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "OK — the free instance is awake."
              exit 0
            fi
            sleep 10
          done
          echo "No HTTP 200 after retries (possibly cold-starting); exiting 0 on purpose."
          exit 0
